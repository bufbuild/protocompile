edition = "2026";

package buf.test;

import option "google/protobuf/json_options.proto";

// A lone `{}` is accepted.
export enum Lone {
    LONE_UNSPECIFIED = 0;
    LONE_ONE = 1 [(pb.enumvalue.json) = {}];
}

// `{}` collides like the custom name "".
export enum EmptyCollision {
    EMPTY_COLLISION_UNSPECIFIED = 0;
    EMPTY_COLLISION_A = 1 [(pb.enumvalue.json) = {}];
    EMPTY_COLLISION_B = 2 [(pb.enumvalue.json) = {}];
    EMPTY_COLLISION_C = 3 [(pb.enumvalue.json).string = ""];
}

// For aliases, `{}` is the same as no option at all.
export enum EmptyAliasOk {
    option allow_alias = true;
    EMPTY_ALIAS_OK_UNSPECIFIED = 0;
    EMPTY_ALIAS_OK_ONE = 1 [(pb.enumvalue.json) = {}];
    EMPTY_ALIAS_OK_UNO = 1;
    EMPTY_ALIAS_OK_EIN = 1 [(pb.enumvalue.json) = {}];
}

// ...but not the same as the custom name "".
export enum EmptyAliasBad {
    option allow_alias = true;
    EMPTY_ALIAS_BAD_UNSPECIFIED = 0;
    EMPTY_ALIAS_BAD_ONE = 1 [(pb.enumvalue.json) = {}];
    EMPTY_ALIAS_BAD_UNO = 1 [(pb.enumvalue.json).string = ""];
}
