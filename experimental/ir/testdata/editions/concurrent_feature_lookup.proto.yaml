# base.proto never uses Closed so its own lowering never resolves the
# enum_type feature. The importers below all resolve it concurrently.
parallelism: 8
files:
- path: "base.proto"
  import: true
  text: |
    edition = "2023";
    package buf.test;

    enum Closed {
      option features.enum_type = CLOSED;
      CLOSED_UNSPECIFIED = 0;
    }

- path: "user0.proto"
  text: |
    edition = "2023";
    package buf.test;

    import "base.proto";

    option features.field_presence = IMPLICIT;

    message M0 {
      Closed f = 1;
    }

- path: "user1.proto"
  text: |
    edition = "2023";
    package buf.test;

    import "base.proto";

    option features.field_presence = IMPLICIT;

    message M1 {
      Closed f = 1;
    }

