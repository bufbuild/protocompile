syntax = "proto3";

message Message   {}

message Empty {
}

message Foo { /* C-style comment in the middle */ }

message Bar {
  // Normal comment in the middle
}

message Baz {

// Body comment.
}

// Stray semicolons print nothing, so these bodies are empty.
message Semi {;}

message Semis {;;;}

service SemiService {;}

// ... but a comment riding along with one still keeps the body open.
message SemiComment {; /* Not dropped. */ }

message SemiLineComment {; // Also not dropped.
}
