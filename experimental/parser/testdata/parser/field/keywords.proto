syntax = "proto3";

package test;

message M {
    // This is only a test for keywords that can start a production.
    syntax syntax = 1;
    edition edition = 2;
    import import = 3;
    package package = 4;
    option option = 5;
    message message = 6;
    enum enum = 7;
    service service = 8;
    extend extend = 9;
    group group = 10;
    oneof oneof = 11;
    map map = 12;
    extensions extensions = 13;
    reserved reserved = 14;
    rpc rpc = 15;
}

message M2 {
    syntax.X syntax = 1;
    edition.X edition = 2;
    import.X import = 3;
    package.X package = 4;
    option.X option = 5;
    message.X message = 6;
    enum.X enum = 7;
    service.X service = 8;
    extend.X extend = 9;
    group.X group = 10;
    oneof.X oneof = 11;
    map.X map = 12;
    extensions.X extensions = 13;
    reserved.X reserved = 14;
    rpc.X rpc = 15;
}

message M3 {
    // Labels are always labels, even if a type shares their name.
    optional optional = 1;
    repeated repeated = 2;
    required required = 3;
}

extend M {
    optional optional = 1;
    repeated repeated = 2;
    required required = 3;
}

message M4 {
    oneof x {
        optional optional = 1;
        repeated repeated = 2;
        required required = 3;
    }
}

message M5 {
    // These must remain valid.
    optional optional a = 1;
    repeated message b = 2;
    .message c = 3;
    .optional d = 4;
    test.message e = 5;
    optional.X f = 6;
    .option.X o = 7;
    .reserved r = 8;
    .extensions x = 9;

    // Inside a oneof, only labels and `option` are special.
    oneof x {
        message g = 10;
        enum h = 11;
        oneof i = 12;
        extend j = 13;
        reserved.X r2 = 14;
        extensions.X x2 = 15;
    }
}

message M6 {
    // `option` still starts an option inside a oneof.
    oneof x {
        option.X a = 1;
    }
}

extend M {
    message k = 20;
    enum l = 21;
    oneof m = 22;
    extend n = 23;
    option.X o = 24;
    reserved.X r = 25;
    extensions.X x = 26;
}
